name: browserquest
services:
  auth-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: supabase_auth_admin
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Run npm run auth:init}
      POSTGRES_DB: auth
    volumes:
      - auth-data:/var/lib/postgresql/data
      - ./infra/auth/init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U supabase_auth_admin -d auth"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  auth-mail:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:54326:8025"
    restart: unless-stopped
  auth-templates:
    image: nginx:1.28-alpine
    volumes:
      - ./infra/auth/templates:/usr/share/nginx/html:ro
    restart: unless-stopped
  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      auth-db:
        condition: service_healthy
      auth-mail:
        condition: service_started
      auth-templates:
        condition: service_started
    ports:
      - "127.0.0.1:54325:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${AUTH_PUBLIC_URL:-http://127.0.0.1:54325}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@auth-db:5432/auth
      GOTRUE_SITE_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:8085}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_REDIRECT_URLS:-http://127.0.0.1:8085/api/auth/callback,http://127.0.0.1:8086/api/auth/callback}
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:?Run npm run auth:init}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ISSUER: ${AUTH_PUBLIC_URL:-http://127.0.0.1:54325}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-auth-mail}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-aventuriers@browserquest.local}
      GOTRUE_SMTP_SENDER_NAME: BrowserQuest
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://auth-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://auth-templates/recovery.html
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${AUTH_PUBLIC_URL:-http://127.0.0.1:54325}/callback
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${AUTH_PUBLIC_URL:-http://127.0.0.1:54325}/callback
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  auth-data:
